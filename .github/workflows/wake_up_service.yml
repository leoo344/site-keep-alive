name: Browser Automation Wakeup
on:
  schedule:
    - cron: '*/7 * * * *' # Every 7 minutes
  workflow_dispatch:      # Manual trigger

jobs:
  fill_form_and_click:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          npm install playwright
          npx playwright install-deps chromium
          npx playwright install chromium

      - name: Open Site and Fill Migration Form
        run: |
          node -e "
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext();
            const page = await context.newPage();
            
            try {
              console.log('Navigating to RevivePass...');
              await page.goto('https://revivepass.vercel.app/', { waitUntil: 'domcontentloaded', timeout: 60000 });
              
              // Wait for the main button and click
              const mainBtn = page.getByText('Create Migration').first();
              await mainBtn.waitFor({ state: 'visible', timeout: 15000 });
              await mainBtn.click();
              console.log('Main button clicked.');

              // Fill Migration title with 15 characters
              const titleInput = page.getByPlaceholder('Migration title');
              await titleInput.waitFor({ state: 'visible' });
              await titleInput.fill('ReviveProject15'); // 15 chars
              console.log('Filled Title.');

              // Fill Description with 15 characters
              const descInput = page.getByPlaceholder('Description');
              await descInput.waitFor({ state: 'visible' });
              await descInput.fill('DescDescription'); // 15 chars
              console.log('Filled Description.');

              // Click the final Create Migration button inside the form
              const submitBtn = page.locator('button:has-text(\"Create Migration\")').last();
              await submitBtn.click();
              console.log('Form submitted successfully!');
              
              await page.waitForTimeout(2000);
            } catch (e) {
              console.error('Error during execution:', e.message);
              process.exit(1);
            } finally {
              await browser.close();
            }
          })();
          "
